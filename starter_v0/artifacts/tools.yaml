# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for one missing detail or for explicit confirmation before a write action. Use this instead of guessing an asset_id, employee_id, environment, or ticket confirmation. For ticket creation, ask a yes_no question that restates the exact latest summary, priority, and asset_id."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The single clarification or confirmation question to show the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for IDs/details, yes_no for confirmations, and choice when the valid options are known."}
        options: {type: array, default: [], items: {type: string}, description: "Allowed choices for response_type=choice, such as production/staging."}
      required: [question, response_type]

  - name: search_kb
    description: "Search the internal troubleshooting knowledge base for how-to guidance and remediation steps. Use for instructions about VPN, Outlook/email setup, Wi-Fi troubleshooting, printing, accounts, security, hardware, software, or meeting-room support. Do not use for live service status, device diagnostics, employee lookup, policy questions, or ticket creation."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Troubleshooting topic or user-visible error message to search for."}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Best matching article category. Prefer a specific category when the topic is clear."}
        top_k: {type: integer, default: 3, description: "Number of articles to return."}
      required: [query]

  - name: check_service_status
    description: "Check live-like status for a shared IT service, not a specific device. Use when the user asks whether VPN, email, SSO, Wi-Fi, or printing is up/down/degraded in production or staging. If the environment is missing, default to production only when the user did not imply another environment; if the environment is invalid or ambiguous, ask clarify."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Shared service to check."}
        environment: {type: string, enum: [production, staging], default: "production", description: "Service environment. Preserve staging when the user says staging, test, or asks to keep the previous staging context."}
      required: [service]

  - name: inspect_device
    description: "Inspect one known internal asset and return inventory plus diagnostics. Use only when the user provides a concrete asset_id such as LT-204, DT-087, PR-404, RM-501, or MB-012. Do not invent an asset_id from words like 'my laptop'; call clarify if it is missing. Call this once per asset when comparing multiple devices."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Exact internal asset ID, preserving the latest corrected ID from the conversation."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Diagnostic area requested by the user. Use network for Wi-Fi/connectivity, vpn for VPN, security for encryption/endpoint/compliance, hardware for battery/disk/memory/peripherals, software for apps/drivers/print queue."}
      required: [asset_id]

  - name: lookup_user
    description: "Look up one employee record and assigned assets from the internal directory. Use only when the user provides an employee_id such as EMP-1003. Do not guess from department, office, role, or partial name; ask clarify when the employee identity is ambiguous or missing."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Exact employee ID, using the latest corrected value in the conversation."}
      required: [employee_id]

  - name: format_incident_report
    description: "Format findings that are already present in the conversation or already returned by tools into an incident report. Use this when the user asks to present, summarize, or hand off existing findings. Do not refetch diagnostics or status when the user explicitly says not to check again."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Findings already known from the user or previous tool results."
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Report style requested by the user."}
        incident_title: {type: string, default: "IT incident", description: "User-provided incident title, if any."}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Search public web information for a manufacturer and public device model only. Use for official specs, drivers, support pages, or compatibility for products such as Lenovo ThinkPad T14 Gen 4. Never include asset IDs, employee IDs, serials, hostnames, locations, assigned users, diagnostics, or internal incident details. If the user mixes public model text with internal identifiers, ask clarify to remove the internal identifiers before searching."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Public manufacturer only, for example Lenovo, Dell, HP, Apple, or Logitech."}
        model: {type: string, description: "Public model name only, for example ThinkPad T14 Gen 4. Exclude internal IDs."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Public information type requested."}
        max_results: {type: integer, default: 3, description: "Number of public results, maximum 5."}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Search internal IT policy and operating rules. Use for questions about allowed actions, data privacy, MFA/password handling, external tools, ticket requirements, service operations, access control, or incident priority. Do not use for troubleshooting how-to articles, live status, device diagnostics, or employee lookup."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question or rule to search for."}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Best matching policy area. Prefer a specific area when clear."}
        top_k: {type: integer, default: 3, description: "Number of policy snippets to return."}
      required: [query]

  - name: create_ticket
    description: "Create a local mock support ticket. This is a write action. Use only after the user has explicitly confirmed the latest ticket payload in natural language. Set confirmed=true only when the latest summary, priority, and asset_id have not changed since that confirmation. If the user asks to create, draft, change, review, cancel, or confirm an older payload, use clarify or answer without this tool as appropriate. Never put passwords, MFA/OTP codes, API keys, tokens, recovery codes, or other secrets in summary."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Concise incident summary with secrets removed."}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Latest requested priority."}
        asset_id: {type: string, default: "", description: "Associated asset ID if explicitly provided."}
        confirmed: {type: boolean, default: false, description: "True only after explicit confirmation of the latest unchanged payload."}
      required: [summary]
